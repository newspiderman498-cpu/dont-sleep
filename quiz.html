<!DOCTYPE html>
<html lang="th" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทำข้อสอบ - M.4 PREP</title>

    <!-- Google Fonts & Font Awesome & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- โหลดค่าธีม Dark/Light Mode -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('m4prep_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }

        .study-header {
            background: linear-gradient(135deg, #2563eb 0%, #0d6efd 100%);
            color: white;
            padding: 40px 0 30px 0;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .content-card {
            background-color: var(--bs-card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 35px;
            margin-top: -30px;
            border: 1px solid var(--bs-border-color-translucent);
        }

        .badge-subject {
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* ตกแต่งตัวเลือกข้อสอบ */
        .question-item {
            background-color: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .option-box {
            border: 2px solid var(--bs-border-color);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--bs-card-bg);
            display: flex;
            align-items: center;
        }

        .option-box:hover:not(.disabled) {
            border-color: #2563eb;
            background-color: rgba(37, 99, 235, 0.08);
        }

        .option-box.selected {
            border-color: #2563eb;
            background-color: rgba(37, 99, 235, 0.14);
            font-weight: 600;
        }

        .option-box.is-correct {
            border-color: #16a34a !important;
            background-color: rgba(22, 163, 74, 0.15) !important;
            color: #16a34a;
            font-weight: 600;
        }

        .option-box.is-wrong {
            border-color: #dc2626 !important;
            background-color: rgba(220, 38, 38, 0.15) !important;
            color: #dc2626;
        }

        .option-prefix {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--bs-tertiary-bg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .explanation-box {
            background-color: var(--bs-tertiary-bg);
            border-left: 4px solid #2563eb;
            border-radius: 8px;
            padding: 15px 20px;
            margin-top: 15px;
        }

        .action-box {
            background-color: var(--bs-tertiary-bg);
            border-radius: 16px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="fas fa-edit me-2"></i>M.4 PREP QUIZ
            </a>
            <div class="d-flex gap-2">
                <a href="analytics.html" class="btn btn-outline-primary btn-sm rounded-pill">
                    <i class="fas fa-chart-pie me-1"></i>วิเคราะห์คะแนน
                </a>
                <a href="summary.html?mode=quiz" class="btn btn-outline-secondary btn-sm rounded-pill">
                    <i class="fas fa-arrow-left me-1"></i>กลับหน้าคลังข้อสอบ
                </a>

    <!-- Header Section -->
    <header class="study-header text-center">
        <div class="container" id="headerContainer">
            <div class="spinner-border text-light mb-2" role="status"></div>
            <p class="mb-0 text-white-50">กำลังเตรียมข้อสอบ...</p>

    <!-- Main Content Body -->
    <main class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="content-card" id="mainContentCard">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3 text-muted">กำลังดึงรายการข้อสอบจากระบบ...</p>
                    </div>
                </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Config Supabase
        const SUPABASE_URL = 'https://jykdmzhqrcdyulztcota.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5a2RtemhxcmNkeXVsenRjb3RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTg0MjcsImV4cCI6MjEwNTM5NDQyN30.Cz7joFgrCPLFyAhKlUL9azLcExXsskUEoAUBd0yc99E';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const subjectConfig = {
            'math': { name: 'คณิตศาสตร์', badgeClass: 'bg-primary text-white', icon: 'fa-calculator' },
            'science': { name: 'วิทยาศาสตร์', badgeClass: 'bg-success text-white', icon: 'fa-flask' },
            'english': { name: 'ภาษาอังกฤษ', badgeClass: 'bg-danger text-white', icon: 'fa-language' },
            'thai': { name: 'ภาษาไทย', badgeClass: 'bg-warning text-dark', icon: 'fa-book-open' },
            'society': { name: 'สังคมศึกษา', badgeClass: 'bg-info text-white', icon: 'fa-globe-asia' },
            'other': { name: 'วิชาทั่วไป', badgeClass: 'bg-secondary text-white', icon: 'fa-book' }
        };

        let questionsData = [];
        let userAnswers = {};
        let isSubmitted = false;

        // ตัวแปรส่วนกลางสำหรับเก็บข้อมูลวิชา, ชื่อชุดข้อสอบ และหัวข้อสำรอง
        let currentSubjectKey = 'other';
        let currentExamSetTitle = 'แบบทดสอบทั่วไป';
        let currentFallbackTopic = 'แบบทดสอบทั่วไป';

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&')
                .replace(/</g, '<')
                .replace(/>/g, '>')
                .replace(/"/g, '"');
        }

        function getSubjectKey(item) {
            if (!item) return 'other';

            const directVal = String(
                (typeof item === 'string' ? item : '') ||
                item.subject ||
                item.subject_id ||
                item.category ||
                item.subject_name ||
                item.type ||
                item.course_type ||
                ''
            ).toLowerCase().trim();

            if (
                directVal === 'science' ||
                directVal === 'sci' ||
                directVal === 'วิทย์' ||
                directVal === 'วิทยาศาสตร์' ||
                directVal === '2' ||
                directVal.includes('sci') ||
                directVal.includes('วิทย์')
            ) {
                return 'science';
            }

            if (directVal === 'math' || directVal === 'คณิต' || directVal === 'คณิตศาสตร์' || directVal === '1' || directVal.includes('คณิต')) return 'math';
            if (directVal === 'english' || directVal === 'eng' || directVal === 'ภาษาอังกฤษ' || directVal === '3' || directVal.includes('อังกฤษ')) return 'english';
            if (directVal === 'thai' || directVal === 'ภาษาไทย' || directVal === 'ไทย' || directVal === '4' || directVal.includes('ไทย')) return 'thai';
            if (directVal === 'society' || directVal === 'soc' || directVal === 'สังคมศึกษา' || directVal === 'สังคม' || directVal === '5' || directVal.includes('สังคม')) return 'society';

            const textContent = (String(item.title || item.name || item.topic || '') + ' ' + String(item.description || item.detail || '')).toLowerCase();

            if (['วิทย์', 'science', 'sci', 'ฟิสิกส์', 'เคมี', 'ชีว', 'ดารา', 'โลก', 'ธรณี', 'เซลล์', 'พืช', 'สัตว์', 'แรง', 'พลังงาน', 'ไฟฟ้า', 'อะตอม', 'สาร'].some(k => textContent.includes(k))) return 'science';
            if (['คณิต', 'math', 'เซต', 'สมการ', 'ตรีโกณ', 'ฟังก์ชัน', 'เลข', 'สถิติ', 'ความน่าจะเป็น'].some(k => textContent.includes(k))) return 'math';
            if (['อังกฤษ', 'english', 'eng', 'vocab', 'grammar', 'tense'].some(k => textContent.includes(k))) return 'english';
            if (['ไทย', 'thai', 'วรรณคดี', 'หลักภาษา', 'โคลง', 'กลอน'].some(k => textContent.includes(k))) return 'thai';
            if (['สังคม', 'social', 'ประวัติ', 'ภูมิศาสตร์', 'ศาสนา', 'เศรษฐ'].some(k => textContent.includes(k))) return 'society';

            return 'other';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            const userEmail = session?.user?.email || localStorage.getItem('user_email');

            if (!userEmail) {
                document.getElementById('headerContainer').innerHTML = `<h3 class="fw-bold text-warning">จำกัดสิทธิ์โหมดทดลองเรียน</h3>`;
                document.getElementById('mainContentCard').innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-user-lock text-primary display-4 mb-3"></i>
                        <h4 class="fw-bold mb-2">กรุณาเข้าสู่ระบบก่อนทำข้อสอบ</h4>
                        <p class="text-secondary mb-4">เพื่อให้ระบบสามารถบันทึกคะแนนและวิเคราะห์จุดอ่อน-จุดแข็งของคุณได้</p>
                        <a href="login.html" class="btn btn-primary rounded-pill px-4 me-2">เข้าสู่ระบบเลย</a>
                        <a href="summary.html?mode=summary" class="btn btn-outline-secondary rounded-pill px-4">กลับไปอ่านสรุป</a>
                    </div>
                `;
                return;
            }

            loadQuizData();
        });

        // 1. ดึงข้อมูลข้อสอบ (รองรับทั้งแบบเลือกตามชุด exam_set และเลือกตามหัวข้อ topic)
        async function loadQuizData() {
            const params = new URLSearchParams(window.location.search);
            const rawExamSet = params.get('exam_set') || params.get('set');
            const topicIdParam = params.get('topic_id') || params.get('id');
            const rawTopicName = params.get('topic_name') || params.get('topic');
            const rawSubject = params.get('subject');

            try {
                let quizList = [];
                let displayTitle = rawExamSet || rawTopicName || 'แบบทดสอบตะลุยโจทย์';
                let subjectName = rawSubject || '';

                const { data: allQuizzes, error } = await _supabase
                    .from('quizzes')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;
                const quizzesPool = allQuizzes || [];

                // กรองวิชาเบื้องต้นหากมีการส่ง subject มาใน URL
                const subjectFilteredPool = rawSubject
                    ? quizzesPool.filter(q => getSubjectKey(q) === getSubjectKey(rawSubject))
                    : quizzesPool;

                // กรณีที่ 1: ส่งชื่อชุดข้อสอบ (exam_set) มาโดยตรง
                if (rawExamSet) {
                    const targetSet = rawExamSet.trim().toLowerCase();
                    quizList = subjectFilteredPool.filter(q => {
                        const qSet = String(q.exam_set || q.topic || '').trim().toLowerCase();
                        return qSet === targetSet;
                    });
                    displayTitle = rawExamSet.trim();
                }

                // กรณีที่ 2: ส่ง topic_id มาเป็นตัวเลข
                if (quizList.length === 0 && topicIdParam && !isNaN(topicIdParam)) {
                    const { data: topicData } = await _supabase.from('topics').select('*').eq('id', topicIdParam).maybeSingle();
                    if (topicData) {
                        displayTitle = topicData.title || topicData.name || topicData.topic_name || displayTitle;
                        subjectName = topicData.subject || topicData.subject_id || subjectName;
                    }
                    quizList = subjectFilteredPool.filter(q => String(q.topic_id || '') === String(topicIdParam));
                }

                // กรณีที่ 3: ส่งชื่อ topic หรือชื่อชุดผ่านพารามิเตอร์ topic / topic_name
                if (quizList.length === 0 && (rawTopicName || topicIdParam)) {
                    const searchName = String(rawTopicName || displayTitle || topicIdParam).trim().toLowerCase();

                    // เช็กก่อนว่าชื่อที่ส่งมาตรงกับชื่อชุดข้อสอบ (exam_set) หรือไม่
                    const matchedBySet = subjectFilteredPool.filter(q => {
                        const qSet = String(q.exam_set || '').trim().toLowerCase();
                        return qSet && qSet === searchName;
                    });

                    if (matchedBySet.length > 0) {
                        quizList = matchedBySet;
                        displayTitle = matchedBySet[0].exam_set;
                    } else {
                        // ถ้าไม่ตรงกับ exam_set ให้หาตามชื่อหัวข้อเรื่อง (topic)
                        quizList = subjectFilteredPool.filter(q => {
                            const qTopicName = String(q.topic_name || q.topic || q.topic_title || '').trim().toLowerCase();
                            return qTopicName && (qTopicName === searchName || qTopicName.includes(searchName) || searchName.includes(qTopicName));
                        });
                    }
                }

                // กรณีที่ 4: ส่งมาเฉพาะชื่อวิชา (ทำรวมทั้งวิชา)
                if (quizList.length === 0 && rawSubject) {
                    quizList = subjectFilteredPool;
                    const subCfg = subjectConfig[getSubjectKey(rawSubject)];
                    displayTitle = `ข้อสอบรวมวิชา${subCfg ? subCfg.name : rawSubject}`;
                }

                if (quizList.length === 0) {
                    renderError('ไม่พบชุดข้อสอบของหัวข้อนี้ในระบบ กรุณากลับไปเลือกวิชาใหม่อีกครั้ง');
                    return;
                }

                questionsData = quizList;
                if (!subjectName && quizList[0]) {
                    subjectName = quizList[0].subject || quizList[0].subject_id || getSubjectKey(quizList[0]);
                }

                currentSubjectKey = getSubjectKey(subjectName);
                currentExamSetTitle = rawExamSet || displayTitle;
                currentFallbackTopic = rawTopicName || displayTitle;

                // นับจำนวนหัวข้อที่อยู่ในชุดข้อสอบนี้ เพื่อแสดงข้อมูลใน Header
                const uniqueTopics = [...new Set(
                    questionsData.map(q => String(q.topic || q.topic_name || '').trim()).filter(Boolean)
                )];

                renderHeaderUI(displayTitle, subjectName, uniqueTopics);
                renderQuizQuestions();

            } catch (err) {
                console.error('Error loading quiz:', err);
                renderError('เกิดข้อผิดพลาดในการดึงข้อมูลข้อสอบ');
            }
        }

        // 2. แสดงผล Header วิชา ชื่อชุดข้อสอบ และหัวข้อที่ครอบคลุม
        function renderHeaderUI(displayTitle, rawSubject, uniqueTopics = []) {
            const subKey = getSubjectKey(rawSubject);
            const config = subjectConfig[subKey] || subjectConfig['other'];

            const topicsSummaryText = uniqueTopics.length > 1
                ? `<div class="mt-2 small text-white-50"><i class="fas fa-tags me-1"></i>ครอบคลุม ${uniqueTopics.length} หัวข้อ: ${escapeHtml(uniqueTopics.join(', '))}</div>`
                : '';

            document.getElementById('headerContainer').innerHTML = `
                <span class="badge badge-subject ${config.badgeClass} mb-2">
                    <i class="fas ${config.icon} me-1"></i>${escapeHtml(config.name)}
                </span>
                <h2 class="fw-bold mb-2">${escapeHtml(displayTitle)}</h2>
                <p class="lead opacity-75 small mb-0">แบบทดสอบประเมินความรู้ ตะลุยโจทย์เตรียมสอบเข้า ม.4 (จำนวน ${questionsData.length} ข้อ)</p>
                ${topicsSummaryText}
            `;
        }

        // 3. แปลงโครงสร้าง Choice ใน Supabase
        function getQuestionChoices(q) {
            if (Array.isArray(q.options) && q.options.length > 0) return q.options;
            if (Array.isArray(q.choices) && q.choices.length > 0) return q.choices;

            let choices = [];
            if (q.option_a !== undefined && q.option_a !== null) choices.push(q.option_a);
            if (q.option_b !== undefined && q.option_b !== null) choices.push(q.option_b);
            if (q.option_c !== undefined && q.option_c !== null) choices.push(q.option_c);
            if (q.option_d !== undefined && q.option_d !== null) choices.push(q.option_d);

            if (choices.length === 0) {
                if (q.choice1 || q.choice_1) choices.push(q.choice1 || q.choice_1);
                if (q.choice2 || q.choice_2) choices.push(q.choice2 || q.choice_2);
                if (q.choice3 || q.choice_3) choices.push(q.choice3 || q.choice_3);
                if (q.choice4 || q.choice_4) choices.push(q.choice4 || q.choice_4);
            }
            return choices;
        }

        function getCorrectAnswerIndex(q, choices) {
            const ans = q.correct_answer !== undefined ? q.correct_answer :
                (q.answer !== undefined ? q.answer :
                    (q.correct !== undefined ? q.correct : q.correct_option));
            if (ans === undefined || ans === null) return 0;

            if (typeof ans === 'number') {
                return (ans >= 0 && ans < choices.length) ? ans : (ans >= 1 ? ans - 1 : 0);
            }

            const strAns = String(ans).trim().toUpperCase();
            if (strAns === 'A' || strAns === '1' || strAns === 'ก') return 0;
            if (strAns === 'B' || strAns === '2' || strAns === 'ข') return 1;
            if (strAns === 'C' || strAns === '3' || strAns === 'ค') return 2;
            if (strAns === 'D' || strAns === '4' || strAns === 'ง') return 3;

            const idx = choices.findIndex(c => String(c).trim() === String(ans).trim());
            return idx !== -1 ? idx : 0;
        }

        // ดึงชื่อหัวข้อเรื่องของโจทย์แต่ละข้อ
        function getQuestionTopicName(q) {
            return String(q.topic || q.topic_name || q.topic_title || currentFallbackTopic || 'ข้อสอบทั่วไป').trim();
        }

        // 4. Render รายการข้อสอบ
        function renderQuizQuestions() {
            const container = document.getElementById('mainContentCard');

            let html = `
                <div class="action-box mb-4 d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="fw-bold mb-1"><i class="fas fa-info-circle text-primary me-2"></i>คำชี้แจงในการทำข้อสอบ</h6>
                        <small class="text-secondary">เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว เมื่อทำเสร็จแล้วระบบจะวิเคราะห์จุดอ่อนแยกตามหัวข้อเรื่องให้ทันที</small>
                    </div>
                </div>
                <div id="questionsContainer">
            `;

            questionsData.forEach((q, qIndex) => {
                const choices = getQuestionChoices(q);
                const questionText = q.question || q.question_text || q.title || `ข้อที่ ${qIndex + 1}`;
                const qTopic = getQuestionTopicName(q);
                const prefixes = ['ก', 'ข', 'ค', 'ง', 'จ'];
                const qImage = q.image_url || q.image || q.img;

                html += `
                    <div class="question-item" id="q_card_${qIndex}">
                        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                            <h5 class="fw-bold mb-0">
                                <span class="badge bg-primary me-2">${qIndex + 1}</span>
                                ${escapeHtml(questionText)}
                            </h5>
                            <span class="badge bg-info-subtle text-info-emphasis rounded-pill fw-normal px-3 py-1">
                                <i class="fas fa-tag me-1"></i>เรื่อง: ${escapeHtml(qTopic)}
                            </span>
                        </div>
                        ${qImage ? `<div class="mb-3"><img src="${qImage}" class="img-fluid rounded" style="max-height:300px;"></div>` : ''}

                        <div class="options-list">
                `;

                choices.forEach((choice, cIndex) => {
                    html += `
                        <div class="option-box" id="opt_${qIndex}_${cIndex}" onclick="selectOption(${qIndex}, ${cIndex})">
                            <span class="option-prefix">${prefixes[cIndex] || (cIndex + 1)}</span>
                            <span>${escapeHtml(choice)}</span>
                        </div>
                    `;
                });

                html += `
                        </div>
                        <div id="explanation_${qIndex}"></div>
                    </div>
                `;
            });

            html += `
                </div>

                <div class="text-center mt-4">
                    <button id="submitBtn" onclick="submitQuiz()" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm">
                        <i class="fas fa-paper-plane me-2"></i>ส่งคำตอบและตรวจคะแนน
                    </button>
                </div>

                <hr class="my-4">
                <div class="d-flex justify-content-between align-items-center">
                    <a href="summary.html?mode=quiz" class="btn btn-outline-primary rounded-pill">
                        <i class="fas fa-arrow-left me-1"></i>กลับไปคลังข้อสอบ
                    </a>
                    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="btn btn-light rounded-pill border">
                        <i class="fas fa-arrow-up me-1"></i>กลับขึ้นด้านบน
                    </button>
                </div>
            `;

            container.innerHTML = html;
        }

        // 5. เลือกคำตอบ
        function selectOption(qIndex, cIndex) {
            if (isSubmitted) return;

            userAnswers[qIndex] = cIndex;

            const choices = getQuestionChoices(questionsData[qIndex]);
            choices.forEach((_, idx) => {
                const optEl = document.getElementById(`opt_${qIndex}_${idx}`);
                if (optEl) {
                    if (idx === cIndex) {
                        optEl.classList.add('selected');
                    } else {
                        optEl.classList.remove('selected');
                    }
                }
            });
        }

        // 6. บันทึกคะแนนลง Supabase แยกตามหัวข้อเรื่อง (topic) ของโจทย์แต่ละข้อ
        async function saveScoresByTopicToSupabase(topicBreakdownList) {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session || !session.user) {
                    console.warn('ไม่พบ Supabase Auth Session ของผู้ใช้');
                    return { saved: false, reason: 'ไม่พบสถานะการเข้าสู่ระบบใน Supabase Auth (กรุณาเข้าสู่ระบบใหม่อีกครั้ง)' };
                }

                // สร้างรายการบันทึกแยกตามแต่ละหัวข้อเรื่อง (topic)
                const rowsWithExamSet = topicBreakdownList.map(item => ({
                    user_id: session.user.id,
                    subject: currentSubjectKey,
                    exam_set: currentExamSetTitle,
                    topic: item.topic,
                    score: item.score,
                    total_questions: item.total
                }));

                let { error } = await _supabase
                    .from('exam_results')
                    .insert(rowsWithExamSet);

                // กรณีฐานข้อมูลยังไม่มีคอลัมน์ exam_set ให้บันทึกแบบไม่มีคอลัมน์ exam_set อัตโนมัติ
                if (error && String(error.message || '').includes('exam_set')) {
                    const fallbackRows = topicBreakdownList.map(item => ({
                        user_id: session.user.id,
                        subject: currentSubjectKey,
                        topic: item.topic,
                        score: item.score,
                        total_questions: item.total
                    }));
                    const retryRes = await _supabase.from('exam_results').insert(fallbackRows);
                    error = retryRes.error;
                }

                if (error) {
                    console.error('Supabase insert error:', error);
                    return { saved: false, reason: error.message };
                }

                return { saved: true };
            } catch (err) {
                console.error('Save score exception:', err);
                return { saved: false, reason: err.message };
            }
        }

        // 7. ตรวจคำตอบ คำนวณคะแนนแยกตามหัวข้อ และบันทึกลงฐานข้อมูล
        async function submitQuiz() {
            if (isSubmitted) return;

            const unanswered = questionsData.findIndex((_, idx) => userAnswers[idx] === undefined);
            if (unanswered !== -1) {
                if (!confirm(`คุณยังไม่ได้ทำข้อที่ ${unanswered + 1} ยืนยันที่จะส่งคำตอบหรือไม่?`)) {
                    document.getElementById(`q_card_${unanswered}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
            }

            isSubmitted = true;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังตรวจและบันทึกคะแนน...';

            let totalScore = 0;
            const topicStatsMap = {}; // เก็บคะแนนแยกตามหัวข้อเรื่อง (topic)

            questionsData.forEach((q, qIndex) => {
                const choices = getQuestionChoices(q);
                const correctIdx = getCorrectAnswerIndex(q, choices);
                const userIdx = userAnswers[qIndex];
                const isCorrect = (userIdx === correctIdx);

                if (isCorrect) {
                    totalScore++;
                }

                // สะสมคะแนนตามหัวข้อเรื่องของข้อนี้
                const qTopic = getQuestionTopicName(q);
                if (!topicStatsMap[qTopic]) {
                    topicStatsMap[qTopic] = { topic: qTopic, score: 0, total: 0 };
                }
                topicStatsMap[qTopic].total += 1;
                if (isCorrect) {
                    topicStatsMap[qTopic].score += 1;
                }

                choices.forEach((_, cIndex) => {
                    const optEl = document.getElementById(`opt_${qIndex}_${cIndex}`);
                    if (optEl) {
                        optEl.classList.add('disabled');
                        optEl.classList.remove('selected');

                        if (cIndex === correctIdx) {
                            optEl.classList.add('is-correct');
                        } else if (cIndex === userIdx && userIdx !== correctIdx) {
                            optEl.classList.add('is-wrong');
                        }
                    }
                });

                const expText = q.explanation || q.explain || q.detail;
                if (expText) {
                    document.getElementById(`explanation_${qIndex}`).innerHTML = `
                        <div class="explanation-box">
                            <strong class="text-primary"><i class="fas fa-lightbulb me-1"></i>คำอธิบายเฉลย:</strong>
                            <p class="mb-0 small mt-1 text-secondary">${escapeHtml(expText)}</p>
                        </div>
                    `;
                }
            });

            const topicBreakdownList = Object.values(topicStatsMap);

            // บันทึกคะแนนแยกตามหัวข้อเรื่องลงตาราง exam_results
            const saveStatus = await saveScoresByTopicToSupabase(topicBreakdownList);

            const statusAlertHTML = saveStatus.saved
                ? `<div class="text-success small fw-bold mt-2"><i class="fas fa-check-circle me-1"></i>บันทึกคะแนนแยกตามหัวข้อเรื่องลงระบบวิเคราะห์ผลการเรียนแล้ว</div>`
                : `<div class="text-danger small fw-bold mt-2"><i class="fas fa-exclamation-triangle me-1"></i>บันทึกคะแนนไม่สำเร็จ: ${escapeHtml(saveStatus.reason)}</div>`;

            // สร้างกล่องสรุปคะแนนแยกตามแต่ละหัวข้อเรื่องในชุดข้อสอบนี้
            const topicBreakdownHTML = `
                <div class="mt-3 text-start bg-body p-3 rounded-3 border mx-auto" style="max-width: 600px;">
                    <div class="fw-bold small text-secondary mb-2">
                        <i class="fas fa-layer-group text-primary me-1"></i>ผลคะแนนแยกตามหัวข้อเรื่องในชุดนี้:
                    </div>
                    ${topicBreakdownList.map(item => {
                        const pct = item.total > 0 ? Math.round((item.score / item.total) * 100) : 0;
                        const isWeak = pct < 60;
                        return `
                            <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                                <div>
                                    <span class="fw-bold">${escapeHtml(item.topic)}</span>
                                    ${isWeak ? '<span class="badge bg-danger-subtle text-danger ms-2">ควรทบทวนเพิ่ม</span>' : '<span class="badge bg-success-subtle text-success ms-2">ผ่านเกณฑ์</span>'}
                                </div>
                                <span class="fw-bold ${isWeak ? 'text-danger' : 'text-success'}">
                                    ${item.score}/${item.total} ข้อ (${pct}%)
                                </span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            const percentage = Math.round((totalScore / questionsData.length) * 100);
            let resultBadge = percentage >= 80 ? 'bg-success' : (percentage >= 50 ? 'bg-primary' : 'bg-danger');
            let resultText = percentage >= 80 ? 'ยอดเยี่ยมมาก! คุณมีความพร้อมสูงมาก' : (percentage >= 50 ? 'ผ่านเกณฑ์! ลองทบทวนจุดที่ผิดอีกนิดนะ' : 'ควรทบทวนเนื้อหาเพิ่มเติมเพื่อความแม่นยำ');

            const scoreCard = `
                <div class="card border-0 bg-body-tertiary text-center p-4 mb-4 rounded-4 shadow-sm">
                    <h4 class="fw-bold mb-2">สรุปผลการทดสอบ</h4>
                    <div class="display-4 fw-bold my-2 text-primary">${totalScore} <span class="fs-4 text-muted">/ ${questionsData.length}</span></div>
                    <p class="mb-2"><span class="badge ${resultBadge} fs-6 px-3 py-2 rounded-pill">${resultText} (${percentage}%)</span></p>
                    ${statusAlertHTML}
                    ${topicBreakdownHTML}
                    <div class="mt-4 d-flex justify-content-center gap-2 flex-wrap">
                        <a href="analytics.html" class="btn btn-primary rounded-pill px-4 fw-bold">
                            <i class="fas fa-chart-pie me-1"></i>ดูผลวิเคราะห์จุดอ่อนรายหัวข้อ
                        </a>
                        <button onclick="location.reload()" class="btn btn-outline-primary rounded-pill px-4">
                            <i class="fas fa-rotate-right me-1"></i>ทำข้อสอบอีกครั้ง
                        </button>
                    </div>
                </div>
            `;

            const container = document.getElementById('mainContentCard');
            container.insertAdjacentHTML('afterbegin', scoreCard);

            submitBtn.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 8. กรณีเกิดข้อผิดพลาด
        function renderError(msg) {
            document.getElementById('headerContainer').innerHTML = `<h3 class="fw-bold text-warning">เกิดข้อผิดพลาด</h3>`;
            document.getElementById('mainContentCard').innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-exclamation-circle text-danger display-4 mb-3"></i>
                    <h5 class="text-muted mb-4">${escapeHtml(msg)}</h5>
                    <a href="summary.html?mode=quiz" class="btn btn-primary rounded-pill px-4">
                        <i class="fas fa-arrow-left me-2"></i>กลับหน้าคลังข้อสอบ
                    </a>
                </div>
            `;
        }
    </script>
</body>
