<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - M.4 PREP</title>

    <!-- Google Fonts & Font Awesome & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .register-card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.1);
            border: none;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
        }

        .input-group-text {
            border-radius: 12px 0 0 12px;
            background-color: #f8fafc;
        }

        .form-control {
            border-radius: 0 12px 12px 0;
            padding: 12px 16px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.15);
        }

        .btn-primary-custom {
            background-color: #2563eb;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: background-color 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: #1d4ed8;
            color: white;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
                <h3 class="fw-bold text-primary mb-1">
                    <i class="fas fa-book-reader me-2"></i>M.4 PREP
                </h3>
            </a>
            <p class="text-muted small">สร้างบัญชีผู้ใช้ใหม่เพื่อเริ่มเตรียมสอบเข้า ม.4</p>
        </div>

        <!-- Alert Container -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">ชื่อ-นามสกุล</label>
                <div class="input-group">
                    <span class="input-group-text text-muted border-end-0"><i class="fas fa-user"></i></span>
                    <input type="text" id="fullName" class="form-control border-start-0" placeholder="นายสมชาย ใจดี" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">อีเมล</label>
                <div class="input-group">
                    <span class="input-group-text text-muted border-end-0"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control border-start-0" placeholder="student@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">รหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text text-muted border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control border-start-0" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">ยืนยันรหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text text-muted border-end-0"><i class="fas fa-check-double"></i></span>
                    <input type="password" id="confirmPassword" class="form-control border-start-0" placeholder="ใส่รหัสผ่านอีกครั้ง" required minlength="6">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary-custom w-100 mb-3">
                <span id="btnText"><i class="fas fa-user-plus me-2"></i>สมัครสมาชิก</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted small mb-0">มีบัญชีผู้ใช้อยู่แล้ว? <a href="login.html" class="text-primary fw-semibold text-decoration-none">เข้าสู่ระบบที่นี่</a></p>
        </div>
    </div>

    <!-- Scripts Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // ตรวจสอบรหัสผ่าน
            if (password !== confirmPassword) {
                showAlert('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน', 'danger');
                return;
            }

            if (password.length < 6) {
                showAlert('รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร', 'danger');
                return;
            }

            setLoading(true);

            try {
                // สมัครสมาชิกผ่าน Supabase Auth
                const { data, error } = await _supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            role: 'student'
                        }
                    }
                });

                if (error) throw error;

                showAlert('สมัครสมาชิกสำเร็จ! กำลังนำคุณไปหน้าเข้าสู่ระบบ...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (err) {
                console.error('Register error:', err);
                showAlert(err.message || 'เกิดข้อผิดพลาดในการสมัครสมาชิก กรุณาลองใหม่อีกครั้ง', 'danger');
            } finally {
                setLoading(false);
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type} text-center py-2 mb-3`;
            alertBox.innerText = message;
            alertBox.classList.remove('d-none');
        }

        function setLoading(isLoading) {
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            btnSubmit.disabled = isLoading;
            if (isLoading) {
                btnText.classList.add('d-none');
                btnSpinner.classList.remove('d-none');
            } else {
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        }
    </script>
</body>

</html>
