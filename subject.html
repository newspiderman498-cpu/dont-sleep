<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">วิชาเรียน - M.4 PREP</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8f9fa;
        }

        .subject-header {
            color: white;
            padding: 60px 0;
            transition: background 0.3s ease;
        }

        .content-card img {
            height: 160px;
            object-fit: cover;
        }

        .content-card {
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="fas fa-book-reader"></i> M.4 PREP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">หน้าแรก</a></li>
                    <li class="nav-item"><a class="nav-link" href="quiz.html">คลังข้อสอบ</a></li>
                    <li class="nav-item"><a class="nav-link" href="summary.html">สรุปเนื้อหา</a></li>
                    <li class="nav-item ms-2">
                        <a href="login.html" class="btn btn-danger btn-sm rounded-pill px-4 mt-1">ออกจากระบบ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Dynamic Header -->
    <header class="subject-header" id="header-bg">
        <div class="container">
            <a href="index.html" class="text-white text-decoration-none small mb-3 d-inline-block">
                <i class="fas fa-arrow-left me-1"></i> ย้อนกลับหน้าหลัก
            </a>
            <div class="d-flex align-items-center gap-3">
                <div class="bg-white rounded-circle p-3 fs-1 d-flex align-items-center justify-content-center" style="width:75px; height:75px;">
                    <i class="fas fa-book" id="header-icon"></i>
                </div>
                <div>
                    <h1 class="fw-bold mb-1" id="subject-title">กำลังโหลด...</h1>
                    <p class="mb-0 text-white-50" id="subject-desc">รายละเอียดวิชา</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold"><i class="fas fa-graduation-cap text-primary me-2"></i>คอร์สเรียนและบทเรียนวิชานี้</h4>
        </div>

        <div class="row g-4" id="courses-container">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">กำลังโหลดบทเรียน...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center small text-secondary">
            &copy; 2024 M.4 Prep Online. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. กำหนดกลุ่มคำค้นหา (keywords) ให้ครอบคลุมทุกรูปแบบที่อาจถูกบันทึกลง Supabase
        const SUBJECT_CONFIG = {
            math: {
                title: 'วิชาคณิตศาสตร์',
                desc: 'รวบรวมเนื้อหา สรุปสูตร และแนวข้อสอบวิชาคณิตศาสตร์ ม.ต้น เพื่อเตรียมสอบเข้า ม.4',
                icon: 'fas fa-calculator',
                textColor: 'text-primary',
                bgGradient: 'linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)',
                keywords: ['math', 'คณิต', 'คณิตศาสตร์']
            },
            science: {
                title: 'วิชาวิทยาศาสตร์',
                desc: 'สรุปเนื้อหา ฟิสิกส์ เคมี ชีววิทยา และโลกดาราศาสตร์ ครบจบในที่เดียว',
                icon: 'fas fa-flask',
                textColor: 'text-success',
                bgGradient: 'linear-gradient(135deg, #16a34a 0%, #15803d 100%)',
                keywords: ['science', 'วิทย์', 'วิทยาศาสตร์', 'ฟิสิกส์', 'เคมี', 'ชีวะ']
            },
            english: {
                title: 'วิชาภาษาอังกฤษ',
                desc: 'สรุปไวยากรณ์ (Grammar) คำศัพท์ และแนวข้อสอบ Reading / Error Identification',
                icon: 'fas fa-language',
                textColor: 'text-danger',
                bgGradient: 'linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)',
                keywords: ['english', 'eng', 'อังกฤษ', 'ภาษาอังกฤษ']
            },
            thai: {
                title: 'วิชาภาษาไทย',
                desc: 'หลักภาษาไทย วรรณคดี การอ่านจับใจความ และการวิเคราะห์ภาษา',
                icon: 'fas fa-book-open',
                textColor: 'text-warning',
                bgGradient: 'linear-gradient(135deg, #d97706 0%, #b45309 100%)',
                keywords: ['thai', 'ไทย', 'ภาษาไทย']
            },
            society: {
                title: 'วิชาสังคมศึกษา',
                desc: 'ศาสนา หน้าที่พลเมือง เศรษฐศาสตร์ ประวัติศาสตร์ และภูมิศาสตร์',
                icon: 'fas fa-globe-asia',
                textColor: 'text-info',
                bgGradient: 'linear-gradient(135deg, #0891b2 0%, #0e7490 100%)',
                keywords: ['society', 'สังคม', 'สังคมศึกษา']
            }
        };

        // 2. อ่านค่าวิชาจาก URL (?subject=...)
        const urlParams = new URLSearchParams(window.location.search);
        const subjectKey = urlParams.get('subject') || 'math';
        const currentConfig = SUBJECT_CONFIG[subjectKey] || SUBJECT_CONFIG['math'];

        // 3. ปรับแต่งหน้าตาเว็บตามวิชาที่กดเข้ามา
        document.getElementById('page-title').innerText = `${currentConfig.title} - M.4 PREP`;
        document.getElementById('subject-title').innerText = currentConfig.title;
        document.getElementById('subject-desc').innerText = currentConfig.desc;
        document.getElementById('header-bg').style.background = currentConfig.bgGradient;
        document.getElementById('header-icon').className = `${currentConfig.icon} ${currentConfig.textColor}`;

        // 4. เชื่อมต่อ Supabase
        const SUPABASE_URL = 'https://jykdmzhqrcdyulztcota.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_kz9-wHYTu0nTM6Lxoi1EGg_LgfrbPvB';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadSubjectCourses() {
            const container = document.getElementById('courses-container');

            try {
                // สร้างระบบค้นหาแบบไดนามิกที่เช็คทั้งคอลัมน์ subject และ title จากทุกคำใน keywords
                const searchConditions = [];
                currentConfig.keywords.forEach(kw => {
                    searchConditions.push(`subject.ilike.%${kw}%`);
                    searchConditions.push(`title.ilike.%${kw}%`);
                });
                const queryFilter = searchConditions.join(',');

                const { data: courses, error } = await _supabase
                    .from('courses')
                    .select('*')
                    .or(queryFilter)
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!courses || courses.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center text-muted py-5">
                            <i class="fas fa-folder-open fa-3x mb-3"></i>
                            <p>ยังไม่มีบทเรียนในวิชา ${currentConfig.title} ในขณะนี้</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                courses.forEach(course => {
                    const imageUrl = course.image_url || 'https://placehold.co/400x300/2563eb/white?text=M.4+Course';
                    const priceBadge = course.price ? `${course.price} บาท` : 'เรียนฟรี';

                    container.innerHTML += `
                        <div class="col-md-3">
                            <div class="card content-card h-100 rounded-3 overflow-hidden">
                                <div class="position-relative">
                                    <img src="${imageUrl}" class="card-img-top" alt="${course.title || 'Course Image'}">
                                    <span class="type-badge text-primary"><i class="fas fa-book me-1"></i> คอร์สเรียน</span>
                                </div>
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <span class="badge bg-primary mb-2">${priceBadge}</span>
                                        <h5 class="card-title fw-bold">${course.title || course.name || 'ไม่มีชื่อคอร์ส'}</h5>
                                        <p class="card-text text-muted small">${course.description || course.detail || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                                    </div>
                                    <a href="study.html?id=${course.id}" class="btn btn-outline-primary btn-sm w-100 mt-3 rounded-pill">เริ่มเรียนเลย</a>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error('Error fetching subject courses:', err);
                container.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        <i class="fas fa-exclamation-circle fa-2x mb-2"></i>
                        <p>เกิดข้อผิดพลาดในการโหลดบทเรียน</p>
                    </div>
                `;
            }
        }

        loadSubjectCourses();
    </script>
</body>

</html>
